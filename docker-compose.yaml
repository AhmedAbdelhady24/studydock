version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: studydock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studydock
      POSTGRES_PASSWORD: studydock_password
      POSTGRES_DB: studydock
    ports:
      # Strictly bound to localhost (127.0.0.1) for privacy & security
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studydock -d studydock"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: studydock-app:latest
    container_name: studydock-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://studydock:studydock_password@db:5432/studydock
      PORT: "3000"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # Web app bound strictly to localhost (127.0.0.1:3000)
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
    name: studydock_postgres_data
