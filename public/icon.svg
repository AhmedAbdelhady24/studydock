<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="studydockBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#5B52ED" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle rounded container -->
  <rect width="64" height="64" rx="18" fill="url(#studydockBrandGrad)" />
  <rect width="64" height="64" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Education Open Book & Milestone Criteria Checkmark -->
  <g transform="translate(10, 11) scale(1.85)" filter="url(#bookShadow)">
    <!-- Left Page -->
    <path
      d="M2.5 5C2.5 3.9 3.4 3 4.5 3H10C11.1 3 12 3.9 12 5V18C11 16.5 9.5 16 8 16H3.5C2.95 16 2.5 15.55 2.5 15V5Z"
      fill="#FFFFFF"
      fill-opacity="0.96"
    />
    <!-- Right Page -->
    <path
      d="M21.5 5C21.5 3.9 20.6 3 19.5 3H14C12.9 3 12 3.9 12 5V18C13 16.5 14.5 16 16 16H20.5C21.05 16 21.5 15.55 21.5 15V5Z"
      fill="#FFFFFF"
      fill-opacity="0.96"
    />
    <!-- Spine Divider Line -->
    <line x1="12" y1="5.2" x2="12" y2="17.8" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round" />
    <!-- Criteria Checkmark on Right Page (Milestone Attestation) -->
    <path
      d="M14.8 9.8L16.8 11.8L19.8 7.6"
      fill="none"
      stroke="#10B981"
      stroke-width="1.9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Text Lines on Left Page -->
    <line x1="5" y1="7.2" x2="9.5" y2="7.2" stroke="#4F46E5" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round" />
    <line x1="5" y1="10.2" x2="9" y2="10.2" stroke="#4F46E5" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round" />
    <line x1="5" y1="13.2" x2="7.8" y2="13.2" stroke="#4F46E5" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round" />
    <!-- Golden Amber Bookmark Ribbon -->
    <path
      d="M10.8 1.5H13.2V6.5L12 5.5L10.8 6.5V1.5Z"
      fill="#F59E0B"
    />
  </g>
</svg>
